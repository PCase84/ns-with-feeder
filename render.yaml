services:
  - type: web
    name: ns-feeder
    env: node
    region: frankfurt
    plan: free
    autoDeploy: true
    buildCommand: npm install --no-audit --no-fund
    startCommand: node index.mjs
    healthCheckPath: /
    envVars:
      - key: SHARE_ACCOUNT_NAME      # e.g. +4912345678...
        sync: false
      - key: SHARE_PASSWORD
        sync: false
      - key: NIGHTSCOUT_URL          # https://your-nightscout.onrender.com
        sync: false
      - key: NIGHTSCOUT_API_SECRET
        sync: false
      - key: CONNECT_SHARE_SERVER    # EU-Host
        value: shareous1.dexcom.com
      - key: POLL_MINUTES
        value: "5"
      - key: MAX_COUNT
        value: "288"
