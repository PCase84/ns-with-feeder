services:
  - type: web
    name: ns-feeder
    env: node
    region: frankfurt
    plan: free
    autoDeploy: true
    buildCommand: cd feeder && npm ci
    startCommand: node index.mjs
    healthCheckPath: /
    envVars:
      - key: SHARE_ACCOUNT_NAME      # z.B. +49...
        sync: false
      - key: SHARE_PASSWORD
        sync: false
      - key: NIGHTSCOUT_URL          # https://dein-nightscout.onrender.com
        sync: false
      - key: NIGHTSCOUT_API_SECRET
        sync: false
      - key: CONNECT_SHARE_SERVER    # EU-Host
        value: shareous1.dexcom.com
      - key: POLL_MINUTES
        value: "5"
      - key: MAX_COUNT
        value: "288"
